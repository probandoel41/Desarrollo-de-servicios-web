# Configuracion Base de Datos XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/miparqueo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

server.port=8081

app.admin.email=admin@miparqueo.local
app.demo.client-email=cliente@miparqueo.local
