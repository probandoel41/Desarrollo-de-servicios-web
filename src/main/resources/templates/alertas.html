<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Alertas - MiParqueo</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="app-shell"><aside class="sidebar"><h2>MiParqueo</h2><nav><ul><li><a href="/ocupacion">Ocupación</a></li><li><a href="/movimientos">Movimientos</a></li><li><a class="active" href="/alertas">Alertas</a></li><li><a href="/pagos">Pagos</a></li><li><a href="/ubicacion-vehiculos">Vehículos</a></li><li><a href="/fidelizacion">Fidelización</a></li><li><a href="/view/usuarios/list">Usuarios</a></li></ul></nav><form action="/view/logout" method="post"><button class="outline-button sidebar-logout" type="submit">Cerrar sesión</button></form></aside><main class="page-content">
	<header class="page-header"><div><span class="eyebrow">Incidencias</span><h1 th:text="${title}">Alertas</h1><p th:text="${description}">Novedades que requieren atención.</p></div><span class="status-pill danger"><i></i><span th:text="${alertasPendientes + ' pendientes'}">0 pendientes</span></span></header>
	<p class="notice success" th:if="${mensaje}" th:text="${mensaje}"></p><p class="notice error" th:if="${error}" th:text="${error}"></p>
	<details class="panel control-panel"><summary>Registrar alerta</summary><form action="/alertas/nueva" method="post" class="inline-form"><label>Título<input name="titulo" maxlength="180" required></label><label>Detalle<input name="mensaje" maxlength="1000" required></label><label>Nivel<select name="nivel"><option value="INFO">Informativa</option><option value="ADVERTENCIA">Advertencia</option><option value="CRITICA">Crítica</option></select></label><button class="primary-button" type="submit">Guardar alerta</button></form></details>
	<section class="alert-list"><article th:each="alerta : ${alertas}" class="alert-item" th:classappend="${alerta.nivel == 'CRITICA' ? ' critical' : ''}"><span class="alert-icon" th:text="${alerta.nivel == 'CRITICA' ? '!' : 'i'}">i</span><div><strong th:text="${alerta.titulo}">Alerta</strong><p th:text="${alerta.mensaje}">Detalle</p><small th:text="${alerta.fecha}">Fecha</small></div><form th:action="@{/alertas/{id}/resolver(id=${alerta.id})}" method="post"><button class="text-button" type="submit">Resolver</button></form></article><p class="empty-state" th:if="${#lists.isEmpty(alertas)}">No hay alertas pendientes.</p></section>
	<details class="panel"><summary>Alertas resueltas (<span th:text="${#lists.size(alertasResueltas)}">0</span>)</summary><ul class="resolved-alerts"><li th:each="alerta : ${alertasResueltas}"><strong th:text="${alerta.titulo}">Alerta resuelta</strong><span th:text="${alerta.fecha}">Fecha</span></li></ul></details>
</main></body>
</html>
