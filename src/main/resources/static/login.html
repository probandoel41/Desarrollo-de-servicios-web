<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183b4d">
    <title>Acceso - MiParqueo</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #173042;
            --muted: #70818a;
            --navy: #183b4d;
            --teal: #2aa198;
            --coral: #f07861;
            --line: #dce6e7;
            --panel: #ffffff;
            --canvas: #f4f7f8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            grid-template-columns: minmax(280px, 0.82fr) minmax(440px, 1.18fr);
            background: var(--canvas);
            color: var(--ink);
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        }

        .brand-panel {
            position: relative;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 42px clamp(28px, 6vw, 88px);
            background: var(--navy);
            color: white;
        }

        .brand-panel::after {
            position: absolute;
            right: -100px;
            bottom: 8%;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(255, 255, 255, .18);
            border-radius: 50%;
            box-shadow: 0 0 0 36px rgba(255, 255, 255, .035), 0 0 0 72px rgba(255, 255, 255, .025);
            content: "";
        }

        .brand-name {
            color: white;
            font-family: Georgia, serif;
            font-size: 25px;
            text-decoration: none;
        }

        .brand-mark { color: var(--coral); }

        .brand-caption {
            position: relative;
            z-index: 1;
            max-width: 360px;
            margin: 0 0 12vh;
        }

        .brand-caption p {
            margin: 0 0 14px;
            color: #9bd5ce;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .brand-caption h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(36px, 4vw, 58px);
            font-weight: 400;
            line-height: 1.08;
        }

        .brand-footer {
            color: #bed0d4;
            font-size: 13px;
        }

        .auth-panel {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 36px 24px;
        }

        .auth-card {
            width: min(100%, 440px);
            padding: clamp(28px, 5vw, 48px);
            border: 1px solid var(--line);
            border-top: 4px solid var(--teal);
            background: var(--panel);
            box-shadow: 0 18px 50px rgba(23, 48, 66, .08);
            animation: arrive .35s ease-out both;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #248b83;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        h2 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: 400;
        }

        .intro {
            margin: 9px 0 25px;
            color: var(--muted);
            font-size: 14px;
        }

        .mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 22px;
            padding: 4px;
            background: #edf3f3;
        }

        .mode-switch button {
            min-height: 42px;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .mode-switch button[aria-selected="true"] {
            background: white;
            color: var(--navy);
            box-shadow: 0 1px 5px rgba(23, 48, 66, .12);
        }

        form[hidden] { display: none; }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #cbd9dc;
            border-radius: 2px;
            background: white;
            color: var(--ink);
            font: inherit;
            font-size: 15px;
        }

        input:focus {
            border-color: var(--teal);
            outline: 3px solid rgba(42, 161, 152, .16);
        }

        .submit-button {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            border: 0;
            background: var(--teal);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s ease;
        }

        .submit-button:hover { background: #218b83; }
        .submit-button:disabled { cursor: wait; opacity: .7; }

        .message {
            margin: 0 0 18px;
            padding: 11px 12px;
            border-left: 3px solid var(--coral);
            background: #fff1ed;
            color: #8b3d2c;
            font-size: 13px;
            line-height: 1.45;
        }

        .message[data-state="success"] {
            border-color: var(--teal);
            background: #e8f6f3;
            color: #176860;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            body { display: block; }
            .brand-panel {
                min-height: 0;
                padding: 22px 24px;
            }
            .brand-panel::after, .brand-caption, .brand-footer { display: none; }
            .brand-name { font-size: 22px; }
            .auth-panel { min-height: calc(100vh - 68px); padding: 28px 18px; }
            .auth-card { padding: 28px 24px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <aside class="brand-panel" aria-label="MiParqueo">
        <a class="brand-name" href="/login.html">Mi<span class="brand-mark">.</span>Parqueo</a>
        <div class="brand-caption" aria-hidden="true">
            <p>Acceso seguro</p>
            <h1>MiParqueo</h1>
        </div>
        <div class="brand-footer">Bogotá, Colombia</div>
    </aside>

    <main class="auth-panel">
        <section class="auth-card" aria-labelledby="form-title">
            <p class="eyebrow">Portal de acceso</p>
            <h2 id="form-title">Inicia sesión</h2>
            <p class="intro" id="form-intro">Ingresa con tu correo y contraseña.</p>

            <div class="mode-switch" role="tablist" aria-label="Acceso a la cuenta">
                <button id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form">Ingresar</button>
                <button id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form">Crear cuenta</button>
            </div>

            <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>

            <form id="login-form" role="tabpanel" aria-labelledby="login-tab">
                <div class="field">
                    <label for="login-username">Correo electrónico</label>
                    <input id="login-username" name="usuario" type="email" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input id="login-password" name="contrasena" type="password" autocomplete="current-password" required>
                </div>
                <button class="submit-button" type="submit">Iniciar sesión</button>
            </form>

            <form id="register-form" role="tabpanel" aria-labelledby="register-tab" hidden>
                <div class="field">
                    <label for="register-username">Correo electrónico</label>
                    <input id="register-username" name="usuario" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="register-password">Contraseña</label>
                    <input id="register-password" name="contrasena" type="password" autocomplete="new-password" minlength="1" required>
                </div>
                <button class="submit-button" type="submit">Crear cuenta</button>
            </form>
        </section>
    </main>

    <script>
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const message = document.getElementById('form-message');
        const formTitle = document.getElementById('form-title');
        const formIntro = document.getElementById('form-intro');

        function setMode(mode) {
            const isLogin = mode === 'login';
            loginTab.setAttribute('aria-selected', String(isLogin));
            registerTab.setAttribute('aria-selected', String(!isLogin));
            loginForm.hidden = !isLogin;
            registerForm.hidden = isLogin;
            formTitle.textContent = isLogin ? 'Inicia sesión' : 'Crea tu cuenta';
            formIntro.textContent = isLogin ? 'Ingresa con tu correo y contraseña.' : 'Regístrate con un correo y una contraseña.';
            clearMessage();
        }

        function showMessage(text, state) {
            message.textContent = text;
            message.dataset.state = state || 'error';
            message.hidden = false;
        }

        function clearMessage() {
            message.textContent = '';
            message.hidden = true;
            delete message.dataset.state;
        }

        function formPayload(form) {
            const data = new FormData(form);
            return {
                usuario: data.get('usuario').trim(),
                contrasena: data.get('contrasena')
            };
        }

        async function submitAuth(event, endpoint, isRegistration) {
            event.preventDefault();
            clearMessage();
            const form = event.currentTarget;
            const button = form.querySelector('button[type="submit"]');
            const originalLabel = button.textContent;
            button.disabled = true;
            button.textContent = 'Procesando...';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(formPayload(form))
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(result.mensaje || (response.status === 401
                        ? 'Error en la autenticación.'
                        : 'No se pudo completar la solicitud.'));
                }

                if (isRegistration) {
                    const username = document.getElementById('register-username').value.trim();
                    registerForm.reset();
                    setMode('login');
                    document.getElementById('login-username').value = username;
                    showMessage(result.mensaje || 'Cuenta creada. Ya puedes iniciar sesión.', 'success');
                } else {
                    showMessage(result.mensaje || 'Autenticación satisfactoria.', 'success');
                    window.setTimeout(() => window.location.assign('/view/dashboard'), 500);
                }
            } catch (error) {
                showMessage(error.message || 'No se pudo conectar con el servicio. Inténtalo de nuevo.');
            } finally {
                button.disabled = false;
                button.textContent = originalLabel;
            }
        }

        loginTab.addEventListener('click', () => setMode('login'));
        registerTab.addEventListener('click', () => setMode('register'));
        loginForm.addEventListener('submit', event => submitAuth(event, '/api/auth/login', false));
        registerForm.addEventListener('submit', event => submitAuth(event, '/api/auth/register', true));

        if (new URLSearchParams(window.location.search).has('error')) {
            showMessage('Correo o contraseña incorrectos.');
        }
    </script>
</body>
</html>
