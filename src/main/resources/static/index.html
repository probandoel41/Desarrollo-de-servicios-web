<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Mi Parqueo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        main {
            padding: 2rem;
        }
        section {
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            margin: 0.5rem 0;
            padding: 0.5rem 1rem;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
        }
        a:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #007bff;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const links = document.querySelectorAll("a");
            links.forEach(link => {
                link.addEventListener("click", function(event) {
                    event.preventDefault();
                    alert(`Navegando a: ${this.textContent}`);
                });
            });
        });
    </script>
</head>
<body>
    <header>
        <h1>Bienvenido a App Mi Parqueo</h1>
    </header>
    <main>
        <section id="usuarios">
            <h2>Gestión de Usuarios</h2>
            <a href="templates/Usuarios/list.html">Lista de Usuarios</a>
            <a href="templates/Usuarios/form.html">Formulario de Usuarios</a>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 App Mi Parqueo</p>
    </footer>
</body>
</html>
